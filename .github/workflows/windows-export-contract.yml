name: Windows consumer export contract
on:
  workflow_dispatch:
  push:
    branches: ['sym/1219-*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make file
      - name: Complete native product build
        shell: msys2 {0}
        run: python3 runtime/tests/windows_native/build_native.py candidate
      - name: Check actual exports and every contract deletion
        shell: msys2 {0}
        run: |
          python3 runtime/tests/windows_exports/test_contract.py --raw "$RUNNER_TEMP/runtime-windows/windows_x86_64_exports.raw.def" > "$RUNNER_TEMP/runtime-windows/contract.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-export-contract
          path: |
            ${{ runner.temp }}/runtime-windows/*.log
            ${{ runner.temp }}/runtime-windows/*.json
            ${{ runner.temp }}/runtime-windows/*.def
            ${{ runner.temp }}/runtime-windows/product/*
