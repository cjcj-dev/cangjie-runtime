# Single runtime CI entry. Each job keeps its original steps; former workflow files are selectable
# through the dispatch input "suite"; push/pull_request keep their original branch and path triggers.
name: runtime-ci
'on':
  push:
    branches:
    - main
    - sym/arm-unit-*
  pull_request:
    paths:
    - .github/scripts/ohos-public-sdk.sh
    - .github/scripts/ohos-routing-controls.py
    - .github/workflows/runtime-ci.yml
    - runtime/CMakeLists.txt
    - runtime/build.py
    - runtime/build/cmake/toolchain/ohos_*
    - runtime/config.cmake
    - runtime/src/CJThread/CMakeLists.txt
    - runtime/tests/test_ohos_public_sdk.py
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run (former workflow file name), or all
        type: choice
        required: true
        options:
        - all
        - apple
        - arm-unit-ref
        - cjthread-windows-bat-rc
        - cjthread-windows-native
        - ios-backing
        - metadata-platform
        - ohos-public-sdk
        - return-poll-native
        - return-safepoint
        - runtime-link-publication
        - runtime-windows
        - safepoint-windows
        - windows-export-contract
        - windows-target-export-contract
      backing_regression:
        description: 'apple: Run backing launcher baseline/candidate/cut/restored evidence / ios-backing: Run only simulator backing launcher regression evidence'
        type: boolean
        default: false
      p04_bsd_tu_only:
        description: 'apple: Run only the P04 bsd TU compile job'
        required: false
        default: false
        type: boolean
      job:
        description: 'apple: which job to run'
        type: choice
        options:
        - all
        - package-init
        - bsd-backing-fail
        - bsd-backing-product
        - ios-stdlib-configure
        - readscope-lifetime
        - readscope-ios
        - readscope-ios-intel
        default: all
      teardown_qualification_1426:
        description: 'arm-unit-ref: Run only bounded native ARM and x64 teardown qualification'
        required: false
        default: false
        type: boolean
      teardown_hosts_2204_2604:
        description: 'arm-unit-ref: Run only native Ubuntu 22.04 and 26.04 teardown qualification for this candidate'
        required: false
        default: false
        type: boolean
      root_qualification_1411:
        description: 'arm-unit-ref: Run only the bounded four-root ARM qualification'
        required: false
        default: false
        type: boolean
      elf_ref:
        description: 'arm-unit-ref: Ref containing the test sources'
        required: true
        type: string
      product_ref:
        description: 'arm-unit-ref: Ref containing the runtime sources'
        required: true
        type: string
      filter:
        description: 'arm-unit-ref: Colon-separated exact Suite.Test names'
        required: true
        type: string
      readscope_android:
        description: 'metadata-platform: Normal Android production and finite x64 emulator image lifecycle only.'
        type: boolean
        default: false
      readscope_linux_arm64:
        description: 'metadata-platform: Normal native ARM64 production and finite image lifecycle only.'
        type: boolean
        default: false
      readscope_android_exit_compare:
        description: 'metadata-platform: Fixed 8e251/d51c normal x64 production; three C API/no-image exit children only.'
        type: boolean
        default: false
      readscope_android_scene:
        description: 'metadata-platform: Prepared single d51c full-image Grok scene; final packaged entry review and execution approval pending.'
        type: boolean
        default: false
      runtime_ref:
        description: 'return-poll-native: Paired runtime commit; its resolved SHA is retained in the evidence.'
        type: string
        required: true
        default: sym/1207-implement-r5855120562
      targets:
        description: 'return-poll-native: Native runner/target matrix (JSON); select only the arm needing new evidence.'
        type: string
        required: false
        default: '[{"runner":"macos-15","target":"aarch64-macos"},{"runner":"macos-15-intel","target":"x86_64-macos"},{"runner":"windows-latest","target":"x86_64-windows"}]'
      readscope_lifetime:
        description: 'runtime-windows: Build the fixed runtime and exercise native image lifetime entry/rollback.'
        type: boolean
        default: false
      readscope_target_inputs:
        description: 'runtime-windows: Normal installed runtime/startup/import prerequisites only; no lifecycle repetitions.'
        type: boolean
        default: false
      readscope_std_consumer:
        description: 'runtime-windows: Consume frozen normal std/public CJ DLL arms only; no runtime production.'
        type: boolean
        default: false
      std_asset_url:
        description: 'runtime-windows: Exact temporary prerelease asset URL for the frozen DLL arms.'
        type: string
        default: ''
      std_asset_sha256:
        description: 'runtime-windows: Preapproved SHA256 of that asset.'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  apple-apple-runtime:
    name: ${{ matrix.runner }} / ${{ matrix.variant }}
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'apple')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && ((github.event_name == 'push' || inputs.job == 'all') && inputs.p04_bsd_tu_only != true) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      CANGJIE_BUILD_JOBS: 3
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          variant: native-macos-arm64
          kind: native
          target: native
          sdk: macosx
          macho_arch: arm64
        - runner: macos-15
          variant: ios-device-aarch64
          kind: ios-device
          target: ios-aarch64
          sdk: iphoneos
          macho_arch: arm64
        - runner: macos-15
          variant: ios-simulator-aarch64
          kind: ios-simulator
          target: ios-simulator-aarch64
          sdk: iphonesimulator
          macho_arch: arm64
        - runner: macos-15-intel
          variant: native-macos-x86_64
          kind: native
          target: native
          sdk: macosx
          macho_arch: x86_64
        - runner: macos-15-intel
          variant: ios-device-aarch64
          kind: ios-device
          target: ios-aarch64
          sdk: iphoneos
          macho_arch: arm64
        - runner: macos-15-intel
          variant: ios-simulator-x86_64
          kind: ios-simulator
          target: ios-simulator-x86_64
          sdk: iphonesimulator
          macho_arch: x86_64
        - runner: macos-26
          variant: native-macos-arm64
          kind: native
          target: native
          sdk: macosx
          macho_arch: arm64
        - runner: macos-26
          variant: ios-device-aarch64
          kind: ios-device
          target: ios-aarch64
          sdk: iphoneos
          macho_arch: arm64
        - runner: macos-26
          variant: ios-simulator-aarch64
          kind: ios-simulator
          target: ios-simulator-aarch64
          sdk: iphonesimulator
          macho_arch: arm64
        - runner: macos-26-intel
          variant: native-macos-x86_64
          kind: native
          target: native
          sdk: macosx
          macho_arch: x86_64
        - runner: macos-26-intel
          variant: ios-device-aarch64
          kind: ios-device
          target: ios-aarch64
          sdk: iphoneos
          macho_arch: arm64
        - runner: macos-26-intel
          variant: ios-simulator-x86_64
          kind: ios-simulator
          target: ios-simulator-x86_64
          sdk: iphonesimulator
          macho_arch: x86_64
    steps:
    - name: Check out source
      uses: actions/checkout@v4
    - name: Resolve per-runner install roots
      run: |
        printf 'INSTALL_ROOT=%s/cangjie-install\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'PACKAGE_ROOT=%s/cangjie-package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Print runner, Xcode, compiler, and SDK versions
      run: |
        sw_vers
        uname -a
        printf 'machine=%s\n' "$(uname -m)"
        printf 'processor_count=%s\n' "$(sysctl -n hw.ncpu)"
        xcodebuild -version
        clang --version
        cmake --version
        for sdk in macosx iphoneos iphonesimulator; do
          printf '%s SDK version: ' "$sdk"
          xcrun --sdk "$sdk" --show-sdk-version
          printf '%s SDK path: ' "$sdk"
          xcrun --sdk "$sdk" --show-sdk-path
        done
    - name: Assert native runner architecture
      if: matrix.kind == 'native'
      env:
        EXPECTED_ARCH: ${{ matrix.macho_arch }}
      run: |
        ulimit -c 0
        actual_arch="$(uname -m)"
        if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
          echo "expected runner architecture $EXPECTED_ARCH, got $actual_arch" >&2
          exit 1
        fi
    - name: Build runtime through build.py
      env:
        BUILD_TARGET: ${{ matrix.target }}
        BUILD_SDK: ${{ matrix.sdk }}
        BUILD_KIND: ${{ matrix.kind }}
      run: |
        cd runtime
        if [[ "$BUILD_KIND" == "native" ]]; then
          python3 build.py build \
            --target "$BUILD_TARGET" \
            --build-type release \
            --prefix "$RUNNER_TEMP/cangjie-preinstall"
        else
          sdk_root="$(xcrun --sdk "$BUILD_SDK" --show-sdk-path)"
          clang_path="$(xcrun --sdk "$BUILD_SDK" --find clang)"
          toolchain_root="$(dirname "$(dirname "$clang_path")")"
          printf 'build.py target=%s\n' "$BUILD_TARGET"
          printf 'build.py target toolchain=%s\n' "$toolchain_root"
          printf 'build.py target sysroot=%s\n' "$sdk_root"
          python3 build.py build \
            --target "$BUILD_TARGET" \
            --build-type release \
            --target-toolchain "$toolchain_root" \
            --target-sysroot "$sdk_root" \
            --prefix "$RUNNER_TEMP/cangjie-preinstall"
        fi
    - name: Install runtime through build.py
      run: |
        cd runtime
        python3 build.py install --prefix "$INSTALL_ROOT"
        # CMake installs libboundscheck.dylib next to libcangjie-runtime.dylib on macOS
        # (runtime/CMakeLists.txt install(TARGETS boundscheck ...)); the dlopen smoke
        # resolves it by leaf name, so assert it landed rather than copying it here.
        if [[ "${{ matrix.kind }}" == "native" ]]; then
          find "$INSTALL_ROOT" -type f -name 'libboundscheck.dylib' | grep . || {
            echo "ERROR: libboundscheck.dylib missing from install tree" >&2; exit 1; }
        fi
        find "$INSTALL_ROOT" -type f -print | sort
    - name: Assert installed runtime Mach-O architecture
      env:
        EXPECTED_ARCH: ${{ matrix.macho_arch }}
      run: |
        runtime_dylib="$(find "$INSTALL_ROOT" -type f -name 'libcangjie-runtime.dylib' -print -quit)"
        if [[ -z "$runtime_dylib" ]]; then
          echo "libcangjie-runtime.dylib was not installed" >&2
          exit 1
        fi
        file_output="$(file "$runtime_dylib")"
        echo "$file_output"
        if [[ "$file_output" != *"$EXPECTED_ARCH"* ]]; then
          echo "expected Mach-O architecture $EXPECTED_ARCH" >&2
          exit 1
        fi
    - name: Run native tests and dlopen smoke
      if: matrix.kind == 'native'
      run: |
        if [[ -f runtime/CMakebuild/CTestTestfile.cmake ]] && \
           grep -Rqs 'add_test' runtime/CMakebuild; then
          ctest --test-dir runtime/CMakebuild --output-on-failure
        else
          echo "No CTest/CJThread test registration exists; running the required dlopen smoke."
        fi

        runtime_dylib="$(find "$INSTALL_ROOT" -type f -name 'libcangjie-runtime.dylib' -print -quit)"
        cat >"$RUNNER_TEMP/runtime_dlopen_smoke.c" <<'EOF'
        #include <dlfcn.h>
        #include <stdio.h>

        int main(int argc, char **argv)
        {
            static const char *symbols[] = {
                /* libcangjie-runtime exports DemangleHandle; plain CJ_MRT_Demangle
                   lives only in the static cangjie-demangle lib (cjfilt), on Linux too. */
                "CJ_MRT_DemangleHandle",
                "CJ_MRT_CjRuntimeInit",
                "CJ_MRT_SetCommandLineArgs",
            };
            if (argc != 2) {
                fprintf(stderr, "usage: %s DYLIB\n", argv[0]);
                return 2;
            }
            void *handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
            if (handle == NULL) {
                fprintf(stderr, "dlopen failed: %s\n", dlerror());
                return 1;
            }
            for (unsigned long i = 0; i < sizeof(symbols) / sizeof(symbols[0]); ++i) {
                dlerror();
                void *symbol = dlsym(handle, symbols[i]);
                const char *error = dlerror();
                if (error != NULL || symbol == NULL) {
                    fprintf(stderr, "dlsym(%s) failed: %s\n", symbols[i],
                            error == NULL ? "null address" : error);
                    return 1;
                }
                printf("resolved %s at %p\n", symbols[i], symbol);
            }
            if (dlclose(handle) != 0) {
                fprintf(stderr, "dlclose failed: %s\n", dlerror());
                return 1;
            }
            return 0;
        }
        EOF
        clang -Wall -Wextra -Werror "$RUNNER_TEMP/runtime_dlopen_smoke.c" \
          -o "$RUNNER_TEMP/runtime_dlopen_smoke"
        # libcangjie-runtime.dylib depends on @rpath/libboundscheck.dylib; make the co-located
        # sibling resolvable by leaf name for the smoke process.
        DYLD_LIBRARY_PATH="$(dirname "$runtime_dylib")${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
          "$RUNNER_TEMP/runtime_dlopen_smoke" "$runtime_dylib"
    - name: Record simulator execution scope
      if: matrix.kind == 'ios-simulator'
      run: |
        xcrun simctl list runtimes
        echo "Simulator execution is build-only: a dylib cannot be launched by simctl on its own; an app bundle and executable lifecycle harness are required."
        echo "The installed simulator dylib was still required to pass the Mach-O architecture assertion."
    - name: Pack install tree for diagnosis
      if: always()
      env:
        ARTIFACT_BASENAME: ${{ matrix.runner }}-${{ matrix.variant }}
      run: |
        mkdir -p "$PACKAGE_ROOT"
        if [[ -d "$INSTALL_ROOT" ]]; then
          tar -C "$INSTALL_ROOT" -czf "$PACKAGE_ROOT/$ARTIFACT_BASENAME.tar.gz" .
        else
          printf 'The build failed before an install tree was created. See the job log.\n' \
            >"$PACKAGE_ROOT/NO_INSTALL_TREE.txt"
          tar -C "$PACKAGE_ROOT" -czf "$PACKAGE_ROOT/$ARTIFACT_BASENAME.tar.gz" NO_INSTALL_TREE.txt
        fi
    - name: Upload install artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: install-${{ matrix.runner }}-${{ matrix.variant }}
        path: ${{ runner.temp }}/cangjie-package/${{ matrix.runner }}-${{ matrix.variant }}.tar.gz
        if-no-files-found: error
        retention-days: 7
  apple-bsd-backing-product:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'apple')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (github.event_name == 'workflow_dispatch' && inputs.job == 'bsd-backing-product') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
        - macos-15
        - macos-15-intel
        build_type:
        - release
        - debug
    steps:
    - uses: actions/checkout@v4
    - name: Build native product
      run: |
        ulimit -c 0
        export CANGJIE_BUILD_JOBS=$(sysctl -n hw.ncpu)
        export GC_UNIT_GATE_SKIP=1
        uptime
        cd runtime
        python3 build.py build --target native --build-type "${{ matrix.build_type }}"
    - name: Install symbol reader
      run: brew list llvm >/dev/null 2>&1 || brew install llvm
    - name: Exercise native product and independent cuts
      run: |
        ulimit -c 0
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        python3 runtime/tests/bsd/check_backing_product.py "$RUNNER_TEMP/backing-product"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backing-product-${{ matrix.runner }}-${{ matrix.build_type }}
        path: ${{ runner.temp }}/backing-product
        retention-days: 7
    name: apple / bsd-backing-product
  apple-bsd-backing-fail:
    name: bsd-backing-fail / ${{ matrix.runner }}
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'apple')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && ((github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'bsd-backing-fail') && inputs.p04_bsd_tu_only != true) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run BSD backing failure paths
      run: |
        actual_arch="$(uname -m)"
        printf 'machine=%s expected=%s\n' "$actual_arch" "${{ matrix.arch }}"
        if [[ "$actual_arch" != "${{ matrix.arch }}" ]]; then
          echo "runner arch mismatch" >&2
          exit 1
        fi
        if [[ "${{ inputs.backing_regression }}" == "true" ]]; then
          BSD_BACKING_REGRESSION_DIR="$RUNNER_TEMP/backing-launcher" \
            python3 runtime/tests/bsd/check_backing_launcher.py
        else
          /bin/bash runtime/tests/bsd/run_backing_fail.sh
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ always() && inputs.backing_regression }}
      with:
        name: backing-launcher-${{ matrix.runner }}
        path: ${{ runner.temp }}/backing-launcher
        retention-days: 7
  apple-p04-bsd-tu:
    name: p04-bsd-tu / ${{ matrix.runner }}
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'apple')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (github.event_name == 'push' || inputs.job == 'all' || inputs.p04_bsd_tu_only == true) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    steps:
    - name: Check out source
      uses: actions/checkout@v4
    - name: Compile P04 bsd translation units
      run: |
        actual_arch="$(uname -m)"
        printf 'machine=%s expected=%s\n' "$actual_arch" "${{ matrix.arch }}"
        if [[ "$actual_arch" != "${{ matrix.arch }}" ]]; then
          echo "runner arch mismatch" >&2
          exit 1
        fi
        sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
        cxx="$(xcrun --sdk macosx --find clang++)"
        printf 'sdk=%s\n' "$sdk_path"
        printf 'cxx=%s\n' "$cxx"
        "$cxx" --version
        bc="runtime/third_party/third_party_bounds_checking_function"
        if [[ ! -f "$bc/include/securec.h" ]]; then
          git clone --depth 1 --branch OpenHarmony-v6.0-Release \
            https://gitcode.com/openharmony/third_party_bounds_checking_function \
            "$bc"
        fi
        test -f "$bc/include/securec.h"
        flags=(
          -std=c++14
          -fno-exceptions
          -fno-strict-aliasing
          -fPIC
          -isysroot "$sdk_path"
          -I runtime/src
          -I "$bc/include"
          -D_LARGEFILE_SOURCE
          -D_FILE_OFFSET_BITS=64
          -DCANGJIE
          -DMRT_MACOS
          -D_XOPEN_SOURCE=600
          -D_DARWIN_C_SOURCE
        )
        probe_rc=0
        printf 'int p04_bsd_compiler_probe(){return 0;}\n' >"$RUNNER_TEMP/p04_empty.cpp"
        "$cxx" "${flags[@]}" -c "$RUNNER_TEMP/p04_empty.cpp" -o "$RUNNER_TEMP/p04_empty.o" || probe_rc=$?
        printf 'P04_BSD_TU file=empty.cpp sample=0 arch=%s rc=%s\n' "$actual_arch" "$probe_rc"
        tus=(
          runtime/src/Heap/z/zPhysicalMemoryBacking_bsd.cpp
          runtime/src/Heap/z/zLargePages_bsd.cpp
          runtime/src/Heap/z/zNUMA_bsd.cpp
        )
        fail=0
        if [[ "$probe_rc" -ne 0 ]]; then
          fail=1
        fi
        for sample in 1 2 3; do
          for tu in "${tus[@]}"; do
            base="$(basename "$tu" .cpp)"
            obj="$RUNNER_TEMP/${base}.s${sample}.o"
            rc=0
            "$cxx" "${flags[@]}" -c "$tu" -o "$obj" || rc=$?
            printf 'P04_BSD_TU file=%s sample=%s arch=%s rc=%s\n' "$(basename "$tu")" "$sample" "$actual_arch" "$rc"
            if [[ "$rc" -ne 0 ]]; then
              fail=1
            fi
          done
        done
        exit "$fail"
  apple-ios-stdlib-configure:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'apple')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && ((github.event_name == 'push' || inputs.job == 'ios-stdlib-configure' || inputs.job == 'all') && inputs.p04_bsd_tu_only != true) }}
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        tuple:
        - arm64
        - simulator_arm64
        - simulator_x86_64
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        repository: cjcj-dev/cjcj
        run-id: 36019663568
        artifact-ids: 10816590496
        merge-multiple: true
        path: ${{ runner.temp }}/stdlib-configure-inputs
    - name: Verify configure input identity
      run: |
        cd "$RUNNER_TEMP/stdlib-configure-inputs"
        cat PROVENANCE
        shasum -a 256 -c SHA256SUMS
        echo 'a0257ed258ea93c1138295c1f1c017358379c10489fbfbb2cc3e1377bb9f675b  libcangjie-ast-support.a' | shasum -a 256 -c -
        chmod +x third_party/flatbuffers/bin/flatc
        echo "CANGJIE_HOME=$RUNNER_TEMP/stdlib-configure-inputs" >> "$GITHUB_ENV"
    - name: Prepare configure dependencies
      run: |
        ulimit -c 0
        xcodebuild -version
        uptime
        brew install ninja llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        git clone --depth 1 --branch OpenHarmony-v6.0-Release https://github.com/openharmony/third_party_bounds_checking_function.git stdlib/third_party/boundscheck-v1.1.16
        git clone --depth 1 https://github.com/openharmony/third_party_pcre2.git stdlib/third_party/pcre2
    - name: Configure baseline, candidate, cut, restored and caller SDK arms
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 3
        CMAKE_C_COMPILER_LAUNCHER: sccache
        CMAKE_CXX_COMPILER_LAUNCHER: sccache
      run: |
        ulimit -c 0
        python3 stdlib/tests/ios_sdk_configure.py --tuple '${{ matrix.tuple }}' \
          --baseline a891df782f6132909c81afb9ecb4c05a73278d03 \
          --output "$RUNNER_TEMP/ios-sdk-evidence"
    - name: Record final load
      if: always()
      run: uptime
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-sdk-${{ matrix.tuple }}
        path: |
          ${{ runner.temp }}/ios-sdk-evidence/**/configure.log
          ${{ runner.temp }}/ios-sdk-evidence/**/result*.json
          ${{ runner.temp }}/ios-sdk-evidence/**/compile_commands.json
          ${{ runner.temp }}/ios-sdk-evidence/**/CMakeCache.txt
    name: apple / ios-stdlib-configure
