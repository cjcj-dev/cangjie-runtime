    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      id: std-msys
      with:
        msystem: CLANG64
        update: false
        install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
    - uses: mozilla-actions/sccache-action@v0.0.10
    - name: Verify frozen inputs and consume normal DLLs
      shell: pwsh
      env:
        READSCOPE_CLANG64: ${{ steps.std-msys.outputs.msys2-location }}/clang64/bin
        READSCOPE_STD_ASSET_URL: ${{ inputs.std_asset_url }}
        READSCOPE_STD_ASSET_SHA256: ${{ inputs.std_asset_sha256 }}
        READSCOPE_OTHER_LIFETIME: ${{ inputs.readscope_lifetime }}
        READSCOPE_OTHER_PRODUCER: ${{ inputs.readscope_target_inputs }}
      run: node stdlib/tests/windows_shared_entry_runner.mjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: readscope-std-consumer
        path: ${{ runner.temp }}/readscope-std-consumer/
        if-no-files-found: error
    name: runtime-windows / readscope-std-consumer
  safepoint-windows-build:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'safepoint-windows'))) }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm:
        - candidate
        - cut-home
        - cut-restore
        - restored
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
    - name: Build native product
      shell: msys2 {0}
      run: python3 runtime/tests/safepoint_windows/build_native.py '${{ matrix.arm }}'
    - name: Link the shared sentinel
      if: matrix.arm == 'candidate'
      shell: msys2 {0}
      run: python3 runtime/tests/safepoint_windows/verify.py --link
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safepoint-windows-${{ matrix.arm }}
        path: |
          ${{ runner.temp }}/safepoint-windows/**/*.log
          ${{ runner.temp }}/safepoint-windows/**/*.json
          ${{ runner.temp }}/safepoint-windows/**/*.diff
          ${{ runner.temp }}/safepoint-windows/*/*.def
          ${{ runner.temp }}/safepoint-windows/sentinel.exe
          ${{ runner.temp }}/safepoint-windows/*/product/*
    name: safepoint-windows / build
  safepoint-windows-verify:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'safepoint-windows'))) }}
    needs: safepoint-windows-build
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        install: mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-gdb
    - uses: actions/download-artifact@v4
      with:
        pattern: safepoint-windows-*
        merge-multiple: true
        path: ${{ runner.temp }}/safepoint-windows
    - name: Exercise the same sentinel against all products
      shell: msys2 {0}
      run: python3 runtime/tests/safepoint_windows/verify.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safepoint-windows-behavior
        path: |
          ${{ runner.temp }}/safepoint-windows/behavior.json
          ${{ runner.temp }}/safepoint-windows/identity.json
          ${{ runner.temp }}/safepoint-windows/*/sentinel.log
          ${{ runner.temp }}/safepoint-windows/*/home.log
          ${{ runner.temp }}/safepoint-windows/*/home.json
    name: safepoint-windows / verify
  windows-export-contract-windows:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'windows-export-contract'))) }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make file
    - name: Complete native product build
      shell: msys2 {0}
      run: python3 runtime/tests/windows_native/build_native.py candidate
    - name: Check actual exports and every contract deletion
      shell: msys2 {0}
      run: |
        python3 runtime/tests/windows_exports/test_contract.py --raw "$RUNNER_TEMP/runtime-windows/windows_x86_64_exports.raw.def" > "$RUNNER_TEMP/runtime-windows/contract.log" 2>&1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-export-contract
        path: |
          ${{ runner.temp }}/runtime-windows/*.log
          ${{ runner.temp }}/runtime-windows/*.json
          ${{ runner.temp }}/runtime-windows/*.def
          ${{ runner.temp }}/runtime-windows/product/*
    name: windows-export-contract / windows
  windows-target-export-contract-windows:
    if: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'windows-target-export-contract'))) }}
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        path: runtime-source
    - uses: actions/checkout@v4
      with:
        repository: cjcj-dev/cjcj
        ref: 34ade075158dce9bb380297cd0c8e1d785a035d8
        path: compiler-entry
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: true
        path-type: inherit
        install: git make python gzip unzip file binutils mingw-w64-x86_64-clang mingw-w64-x86_64-cmake mingw-w64-x86_64-compiler-rt mingw-w64-x86_64-gcc mingw-w64-x86_64-libc++ mingw-w64-x86_64-libunwind mingw-w64-x86_64-ninja mingw-w64-x86_64-python mingw-w64-x86_64-lld
    - name: Preserve native cache directories
      shell: pwsh
      run: |
        $cacheHome = $env:USERPROFILE.Replace('\', '/')
        $cacheConfigHome = $env:LOCALAPPDATA.Replace('\', '/')
        "export USERPROFILE='$cacheHome' LOCALAPPDATA='$cacheConfigHome'" | Set-Content -NoNewline -Encoding utf8 C:/msys64/etc/profile.d/runtime-publication.sh
    - name: Exercise the pinned cjcj 589 production entry
      shell: pwsh
      run: |
        & C:/msys64/mingw64/bin/python.exe runtime-source/runtime/tests/windows_exports/test_native_entry.py --source runtime-source --production-entry compiler-entry --evidence evidence
        exit $LASTEXITCODE
    - name: Check actual DLL contract through the shipped CLI
      shell: pwsh
      run: |
        & C:/msys64/mingw64/bin/python.exe runtime-source/runtime/tests/windows_exports/test_contract.py --raw evidence/windows_x86_64_exports.raw.def *> evidence/export-contract.log
        exit $LASTEXITCODE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: target-exports
        path: evidence/
        retention-days: 7
    name: windows-target-export-contract / windows
