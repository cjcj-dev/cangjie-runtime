name: Windows native runtime product
on:
  workflow_dispatch:
  push:
    branches: ['sym/1205-*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [candidate, cut-region, cut-filler, cut-limit, cut-compiler, restored]
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make file
      - name: Build native product
        shell: msys2 {0}
        run: python3 runtime/tests/windows_native/build_native.py ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-windows-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/runtime-windows/*.log
            ${{ runner.temp }}/runtime-windows/*.json
            ${{ runner.temp }}/runtime-windows/*.diff
            ${{ runner.temp }}/runtime-windows/*.def
            ${{ runner.temp }}/runtime-windows/*.cmake
            ${{ runner.temp }}/runtime-windows/product/*
