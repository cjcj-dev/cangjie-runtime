name: Managed metadata platform checks
on:
  workflow_dispatch:
    inputs:
      readscope_android:
        description: Normal Android production and finite x64 emulator image lifecycle only.
        type: boolean
        default: false
      readscope_linux_arm64:
        description: Normal native ARM64 production and finite image lifecycle only.
        type: boolean
        default: false
      readscope_android_exit_compare:
        description: Fixed 8e251/d51c normal x64 production; three C API/no-image exit children only.
        type: boolean
        default: false
      readscope_android_scene:
        description: Prepared single d51c full-image Grok scene; blocked until fixed debugger bundle is approved.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ !inputs.readscope_android_scene && !inputs.readscope_android && !inputs.readscope_linux_arm64 && !inputs.readscope_android_exit_compare }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-arm64, windows-x64]
        config: [default, testable]
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py prepare --config ${{ matrix.config }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py prepare --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
      - uses: actions/upload-artifact@v4
        if: success() && matrix.config == 'testable'
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/metadata/bundle/
  arms:
    if: ${{ !inputs.readscope_android_scene && !inputs.readscope_android && !inputs.readscope_linux_arm64 && !inputs.readscope_android_exit_compare && always() && !cancelled() }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: baseline}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: candidate}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: caller-sp}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: restored}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: device}
          - {platform: windows-x64, runner: windows-2025, arm: baseline}
          - {platform: windows-x64, runner: windows-2025, arm: candidate}
          - {platform: windows-x64, runner: windows-2025, arm: current-desc}
          - {platform: windows-x64, runner: windows-2025, arm: current-map}
          - {platform: windows-x64, runner: windows-2025, arm: caller-desc}
          - {platform: windows-x64, runner: windows-2025, arm: caller-map}
          - {platform: windows-x64, runner: windows-2025, arm: restored}
          - {platform: windows-x64, runner: windows-2025, arm: device}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/metadata/bundle
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py arm --arm ${{ matrix.arm }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py arm --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-${{ matrix.platform }}-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/*.diff
  pac-capability:
    if: ${{ !inputs.readscope_android_scene && !inputs.readscope_android && !inputs.readscope_linux_arm64 && !inputs.readscope_android_exit_compare }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [pac-off, pac-on]
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.10
      - shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py capability --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json

  readscope-android:
    if: ${{ !inputs.readscope_android_scene && inputs.readscope_android && !inputs.readscope_android_exit_compare }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the fixed bounds source with Git
        run: |
          git init runtime/third_party/third_party_bounds_checking_function
          git -C runtime/third_party/third_party_bounds_checking_function remote add origin https://gitcode.com/openharmony/third_party_bounds_checking_function
          git -C runtime/third_party/third_party_bounds_checking_function fetch --depth=1 origin 2ae82839ecaaa7d031e66ccbd2076d671acfd615
          git -C runtime/third_party/third_party_bounds_checking_function checkout --detach FETCH_HEAD
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable the runner KVM device
        run: test -c /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Normal production and real emulator lifecycle
        run: ulimit -c 0 && node runtime/tests/readscope_native_retention/android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readscope-android
          path: |
            ${{ runner.temp }}/readscope-android/*.json
            ${{ runner.temp }}/readscope-android/*.stdout
            ${{ runner.temp }}/readscope-android/*.stderr
            ${{ runner.temp }}/readscope-android/x86_64/install/**
            ${{ runner.temp }}/readscope-android/aarch64/install/**
          if-no-files-found: error

  readscope-linux-arm64:
    if: ${{ !inputs.readscope_android_scene && inputs.readscope_linux_arm64 && !inputs.readscope_android_exit_compare }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Native tools and fixed bounds source
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build
          git init runtime/third_party/third_party_bounds_checking_function
          git -C runtime/third_party/third_party_bounds_checking_function remote add origin https://gitcode.com/openharmony/third_party_bounds_checking_function
          git -C runtime/third_party/third_party_bounds_checking_function fetch --depth=1 origin 2ae82839ecaaa7d031e66ccbd2076d671acfd615
          git -C runtime/third_party/third_party_bounds_checking_function checkout --detach FETCH_HEAD
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Normal native production and finite lifecycle
        run: ulimit -S -c 0 && ulimit -H -c 0 && node runtime/tests/readscope_native_retention/linux-arm64.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readscope-linux-arm64
          path: |
            ${{ runner.temp }}/readscope-linux-arm64/*.json
            ${{ runner.temp }}/readscope-linux-arm64/*.stdout
            ${{ runner.temp }}/readscope-linux-arm64/*.stderr
            ${{ runner.temp }}/readscope-linux-arm64/install/**
          if-no-files-found: error

  readscope-android-exit-compare:
    if: ${{ !inputs.readscope_android_scene && inputs.readscope_android_exit_compare && !inputs.readscope_android && !inputs.readscope_linux_arm64 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      READSCOPE_ANDROID_EXIT_COMPARE: fixed-three-children-v1
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install the native emulator shared-library dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Enable the runner KVM device
        run: test -c /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Normal fixed-arm production and three common C API exit children
        run: ulimit -S -c 0 && ulimit -H -c 0 && node runtime/tests/readscope_native_retention/android-exit-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readscope-android-exit-compare
          path: |
            ${{ runner.temp }}/readscope-android-exit/*.json
            ${{ runner.temp }}/readscope-android-exit/*.stdout
            ${{ runner.temp }}/readscope-android-exit/*.stderr
            ${{ runner.temp }}/readscope-android-exit/*.pid-logcat
            ${{ runner.temp }}/readscope-android-exit/tombstones/**
            ${{ runner.temp }}/readscope-android-exit/base/install/**
            ${{ runner.temp }}/readscope-android-exit/candidate/install/**
            ${{ runner.temp }}/readscope-android-exit/base/consumer
            ${{ runner.temp }}/readscope-android-exit/candidate/consumer
            ${{ runner.temp }}/readscope-android-exit/base/build/CMakeCache.txt
            ${{ runner.temp }}/readscope-android-exit/candidate/build/CMakeCache.txt
            ${{ runner.temp }}/readscope-android-exit/base/build/build.ninja
            ${{ runner.temp }}/readscope-android-exit/candidate/build/build.ninja
          if-no-files-found: error

  readscope-android-scene:
    if: ${{ inputs.readscope_android_scene }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCENE_ANDROID: ${{ inputs.readscope_android_scene }}
      SCENE_OLD_ANDROID: ${{ inputs.readscope_android }}
      SCENE_OLD_ARM64: ${{ inputs.readscope_linux_arm64 }}
      SCENE_OLD_COMPARE: ${{ inputs.readscope_android_exit_compare }}
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable Grok bundle and fail before preparation if not ready
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/readscope-android-scene-check"
          node runtime/tests/readscope_native_retention/android-scene.mjs --check-bundle > "$RUNNER_TEMP/readscope-android-scene-check/input.json"
          node runtime/tests/readscope_native_retention/android-scene.mjs --require-ready
      - uses: actions/download-artifact@v4
        with:
          repository: cjcj-dev/cangjie-runtime
          run-id: 43760946735
          artifact-ids: '14180621274'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/readscope-android-scene-artifact
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Normal single-job host dependencies and KVM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0 cmake ninja-build
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Fixed-source relink using original normal installed runtime
        shell: bash
        run: |
          ulimit -S -c 0
          ulimit -H -c 0
          node runtime/tests/readscope_native_retention/android-scene.mjs --prepare
      - name: Single original preinit process through Grok-owned driver only
        shell: bash
        run: |
          ulimit -S -c 0
          ulimit -H -c 0
          node runtime/tests/readscope_native_retention/android-scene.mjs --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readscope-android-scene
          path: |
            ${{ runner.temp }}/readscope-android-scene-check/
            ${{ runner.temp }}/readscope-android-scene/*.json
            ${{ runner.temp }}/readscope-android-scene/*.stdout
            ${{ runner.temp }}/readscope-android-scene/*.stderr
            ${{ runner.temp }}/readscope-android-scene/execution/
            ${{ runner.temp }}/readscope-android-scene/grok/
            ${{ runner.temp }}/readscope-android-scene/fixture.so
            ${{ runner.temp }}/readscope-android-scene/consumer
            runtime/tests/readscope_native_retention/android-scene/execute-result.json
