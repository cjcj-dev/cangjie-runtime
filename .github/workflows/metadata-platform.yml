name: Managed metadata platform checks
on:
  workflow_dispatch:
    inputs:
      a2_batch:
        description: 'Explicit A2 batch; full retains the existing platform contract'
        type: choice
        options: [disabled, linux-windows-candidate, full, fixtures, tools]
        default: disabled
      candidate_sha:
        description: 'Exact 40-character event SHA approved for this dispatch'
        type: string
        default: ''
      runtime_source_sha:
        description: 'Fixtures only: fixed runtime checkout SHA, bound to candidate_sha and event SHA'
        type: string
        default: ''
      fixture_tuple_run:
        description: 'Fixtures only: existing runtime run containing same-producer native tuple and reader'
        type: string
        default: ''
      fixture_tool_manifests:
        description: 'Fixtures only: approved JSON platform -> tuple/reader manifest SHA256'
        type: string
        default: ''
      fixture_provenance:
        description: 'Approved JSON: repository, producer_sha, attempt, artifact_ids by platform'
        type: string
        default: ''
      tool_prepare_inputs:
        description: 'Tools only JSON: base_sdk map of platform to approved archive url and sha256; sources use fixed script pins'
        type: string
        default: ''
      resume_run:
        description: 'Completed run with unexecuted Linux/Windows testable targets'
        type: string
        default: ''
      pac_resume:
        description: 'Run the repaired PAC-on configuration once'
        type: boolean
        default: false
  push:
    branches: ['sym/1284-implement-*']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: ${{ !startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch != 'fixtures' && inputs.a2_batch != 'tools' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-arm64, windows-x64]
        config: [default, testable]
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py prepare --config ${{ matrix.config }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py prepare --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepare-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
      - uses: actions/upload-artifact@v4
        if: success() && matrix.config == 'testable'
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/metadata/bundle/
  arms:
    if: ${{ always() && !cancelled() && !startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch != 'fixtures' && inputs.a2_batch != 'tools' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: baseline}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: candidate}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: caller-sp}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: restored}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, arm: device}
          - {platform: windows-x64, runner: windows-2025, arm: baseline}
          - {platform: windows-x64, runner: windows-2025, arm: candidate}
          - {platform: windows-x64, runner: windows-2025, arm: current-desc}
          - {platform: windows-x64, runner: windows-2025, arm: current-map}
          - {platform: windows-x64, runner: windows-2025, arm: caller-desc}
          - {platform: windows-x64, runner: windows-2025, arm: caller-map}
          - {platform: windows-x64, runner: windows-2025, arm: restored}
          - {platform: windows-x64, runner: windows-2025, arm: device}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/metadata/bundle
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py arm --arm ${{ matrix.arm }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py arm --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-${{ matrix.platform }}-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/*.diff
  pac-capability:
    if: ${{ !startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch != 'fixtures' && inputs.a2_batch != 'tools' }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: pac-off, arm: candidate}
          - {config: pac-off, arm: mach-pc}
          - {config: pac-off, arm: mach-desc}
          - {config: pac-off, arm: restored}
          - {config: pac-on, arm: candidate}
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.10
      - shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py capability --config ${{ matrix.config }} --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-${{ matrix.config }}-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/*.diff

  a2-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha && startsWith(github.ref_name, 'sym/1478-') && (inputs.a2_batch == 'linux-windows-candidate' || inputs.a2_batch == 'full') && inputs.resume_run == '' && !inputs.pac_resume }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.a2_batch == 'linux-windows-candidate' && '{"include":[{"platform":"linux-arm64","runner":"ubuntu-24.04-arm","config":"default"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm","config":"testable"},{"platform":"windows-x64","runner":"windows-2025","config":"default"},{"platform":"windows-x64","runner":"windows-2025","config":"testable"}]}' || '{"include":[{"platform":"linux-arm64","runner":"ubuntu-24.04-arm","config":"default"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm","config":"testable"},{"platform":"windows-x64","runner":"windows-2025","config":"default"},{"platform":"windows-x64","runner":"windows-2025","config":"testable"},{"platform":"macos-arm64","runner":"macos-15","config":"default"},{"platform":"macos-arm64","runner":"macos-15","config":"testable"},{"platform":"macos-arm64","runner":"macos-15","config":"pac-on"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ulimit -c 0
          set +e
          timeout --signal=TERM --kill-after=30s 35m python3 runtime/tests/gc_unit/metadata/build.py a2 --config ${{ matrix.config }}
          command_rc=$?
          mkdir -p "$RUNNER_TEMP/metadata"
          echo "$command_rc" > "$RUNNER_TEMP/metadata/workflow-command.rc"
          exit "$command_rc"
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          set +e
          timeout --signal=TERM --kill-after=30s 35m python3 runtime/tests/gc_unit/metadata/build.py a2 --config ${{ matrix.config }}
          command_rc=$?
          mkdir -p "$RUNNER_TEMP/metadata"
          echo "$command_rc" > "$RUNNER_TEMP/metadata/workflow-command.rc"
          exit "$command_rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-candidate-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/*.rc
            ${{ runner.temp }}/metadata/bundle/
            ${{ runner.temp }}/metadata/runtime/
            ${{ runner.temp }}/metadata/a2-test-build/
            ${{ runner.temp }}/metadata/linked-product/
          retention-days: 3
          include-hidden-files: true
          # Preserve source, Ninja commands, objects and libraries even before bundling.
          compression-level: 6
  a2-arms:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha && startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch == 'full' && inputs.resume_run == '' && !inputs.pac_resume }}
    needs: a2-candidate
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-arm64, windows-x64, macos-arm64]
        arm: [code-only, descriptor-owner, restored]
        include:
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: windows-x64, runner: windows-2025}
          - {platform: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/download-artifact@v4
        with:
          name: a2-candidate-${{ matrix.platform }}-testable
          path: ${{ runner.temp }}/metadata/candidate-input
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/metadata/bundle"
          cp -a "$RUNNER_TEMP/metadata/candidate-input/bundle/." "$RUNNER_TEMP/metadata/bundle/"
          chmod +x "$RUNNER_TEMP/metadata/bundle/metadata-code-shape"
          python3 runtime/tests/gc_unit/metadata/build.py a2 --arm ${{ matrix.arm }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/metadata/bundle"
          cp -a "$RUNNER_TEMP/metadata/candidate-input/bundle/." "$RUNNER_TEMP/metadata/bundle/"
          python3 runtime/tests/gc_unit/metadata/build.py a2 --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-${{ matrix.platform }}-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/*.diff

  a2-resume:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha && startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch == 'full' && inputs.resume_run != '' && !inputs.pac_resume }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: windows-x64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-python
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run }}
          name: a2-candidate-${{ matrix.platform }}-testable
          path: ${{ runner.temp }}/metadata/input
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ulimit -c 0
          cp -a "$RUNNER_TEMP/metadata/input/bundle" "$RUNNER_TEMP/metadata/bundle"
          python3 runtime/tests/gc_unit/metadata/build.py a2-resume
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -c 0
          cp -a "$RUNNER_TEMP/metadata/input/bundle" "$RUNNER_TEMP/metadata/bundle"
          python3 runtime/tests/gc_unit/metadata/build.py a2-resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-resume-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
          retention-days: 3

  a2-pac-resume:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha && startsWith(github.ref_name, 'sym/1478-') && inputs.a2_batch == 'full' && inputs.pac_resume && inputs.resume_run == '' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.10
      - shell: bash
        run: |
          ulimit -c 0
          python3 runtime/tests/gc_unit/metadata/build.py a2 --config pac-on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-pac-resume
          path: |
            ${{ runner.temp }}/metadata/*.log
            ${{ runner.temp }}/metadata/*.json
            ${{ runner.temp }}/metadata/bundle/
          retention-days: 3

  fixtures:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.a2_batch == 'fixtures' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {platform: linux-arm64, tuple: linux_aarch64, runner: ubuntu-24.04-arm, config: default}
          - {platform: linux-arm64, tuple: linux_aarch64, runner: ubuntu-24.04-arm, config: testable}
          - {platform: windows-x64, tuple: windows_x86_64, runner: windows-2025, config: default}
          - {platform: windows-x64, tuple: windows_x86_64, runner: windows-2025, config: testable}
          - {platform: macos-arm64, tuple: darwin_aarch64, runner: macos-15, config: default}
          - {platform: macos-arm64, tuple: darwin_aarch64, runner: macos-15, config: testable}
          - {platform: macos-arm64, tuple: darwin_aarch64, runner: macos-15, config: pac-on}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      METADATA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      METADATA_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
      METADATA_RUNTIME_CHECKOUT: ${{ github.workspace }}/_fixture-source
      METADATA_TUPLE_RUN: ${{ inputs.fixture_tuple_run }}
      METADATA_TOOL_REPOSITORY: ${{ fromJSON(inputs.fixture_provenance).repository }}
      METADATA_TOOL_PRODUCER_SHA: ${{ fromJSON(inputs.fixture_provenance).producer_sha }}
      METADATA_TUPLE_ATTEMPT: ${{ fromJSON(inputs.fixture_provenance).attempt }}
      METADATA_TOOL_ARTIFACT_IDS: ${{ toJSON(fromJSON(inputs.fixture_provenance).artifact_ids) }}
      METADATA_TOOL_MANIFESTS: ${{ inputs.fixture_tool_manifests }}
      METADATA_TUPLE_ARTIFACT: ${{ runner.temp }}/metadata-tuple
      METADATA_PLATFORM: ${{ matrix.platform }}
      METADATA_RESUME_RUN: ${{ inputs.resume_run }}
      METADATA_PAC_RESUME: ${{ inputs.pac_resume }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bound dispatch before fetching inputs
        shell: bash
        run: python3 runtime/tests/gc_unit/metadata/platform_inputs.py
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runtime_source_sha }}
          path: _fixture-source
      - name: Verify service-side producer and artifact identity
        id: producer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 runtime/tests/gc_unit/metadata/platform_inputs.py --verify-run
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fixture_tuple_run }}
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/metadata-tuple
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make
      - uses: mozilla-actions/sccache-action@v0.0.10
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ulimit -Sc 0
          ulimit -Hc 0
          python3 runtime/tests/gc_unit/metadata/build.py fixtures --config ${{ matrix.config }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -Sc 0
          ulimit -Hc 0
          python3 runtime/tests/gc_unit/metadata/build.py fixtures --config ${{ matrix.config }}
      - name: Actual cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixtures-${{ matrix.platform }}-${{ matrix.config }}
          path: ${{ runner.temp }}/metadata/
          retention-days: 3
          include-hidden-files: true

  tools:
    name: metadata-tools-${{ matrix.tuple }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.a2_batch == 'tools' && github.ref_name == 'sym/1496-fixtures-1006' && inputs.candidate_sha == github.sha && !inputs.resume_run && !inputs.pac_resume }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        include:
          - {platform: linux-arm64, tuple: linux_aarch64, targets: AArch64, runner: ubuntu-24.04-arm}
          - {platform: windows-x64, tuple: windows_x86_64, targets: 'AArch64;ARM;X86', runner: windows-2025}
          - {platform: macos-arm64, tuple: darwin_aarch64, targets: AArch64, runner: macos-15}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      TOOL_PREPARE_INPUTS: ${{ inputs.tool_prepare_inputs }}
      TUPLE_PLATFORM: ${{ matrix.tuple }}
      METADATA_PLATFORM: ${{ matrix.platform }}
      LLVM_TARGETS: ${{ matrix.targets }}
      TUPLE_ROOT: ${{ runner.temp }}/metadata-tool-sources
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cjcj-dev/cjcj
          ref: bf788bfcb2f1b3172cebb395169b375d1656b91d
          path: _tool-producer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-make git gzip
      - uses: mozilla-actions/sccache-action@v0.0.10
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ulimit -Sc 0
          ulimit -Hc 0
          python3 runtime/tests/gc_unit/metadata/prepare_tools.py _tool-producer
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ulimit -Sc 0
          ulimit -Hc 0
          python3 runtime/tests/gc_unit/metadata/prepare_tools.py _tool-producer
      - name: Actual cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        id: native-artifact
        with:
          name: fixed-llvm-tools-${{ matrix.tuple }}
          path: _tool-producer/fixed-toolchain/${{ matrix.tuple }}/
          retention-days: 3
      - name: Retain service artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.native-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.native-artifact.outputs.artifact-digest }}
        run: |
          printf 'run=%s attempt=%s artifact_id=%s artifact_digest=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-production-logs-${{ matrix.tuple }}
          path: ${{ runner.temp }}/metadata-tool-sources/logs/
          retention-days: 3
